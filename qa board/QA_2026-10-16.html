<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임 QA 공고 2026-10-16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 버그 트래커처럼 훑어보는 한 줄 목록. 상단 요약 수치가 곧 필터 버튼 */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #161D2E;
  --muted: #5A6377;
  --line: #DCE1EA;
  --accent: #2C52C4;
  --accent-soft: #E6ECFB;
  --ok: #18744F;
  --ok-soft: #E1F2E9;
  --warn: #B23A1F;
  --warn-soft: #FBE6E0;
  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1320; --surface: #161D2C; --ink: #E5E9F1; --muted: #98A2B6; --line: #283146;
    --accent: #84A1FF; --accent-soft: #1D2847; --ok: #5FC995; --ok-soft: #133227;
    --warn: #FF8C72; --warn-soft: #391C16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #161D2C; --ink: #E5E9F1; --muted: #98A2B6; --line: #283146;
  --accent: #84A1FF; --accent-soft: #1D2847; --ok: #5FC995; --ok-soft: #133227;
  --warn: #FF8C72; --warn-soft: #391C16; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 24px;
}

header { display: grid; gap: 6px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(26px, 5vw, 36px);
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
.sub a { color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.stat {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 10px;
  padding: 12px 14px;
  text-align: left;
  font: inherit;
  cursor: pointer;
  display: grid;
  gap: 2px;
  transition: border-color .15s, background .15s;
}
.stat:hover { border-color: var(--accent); }
.stat:focus-visible, .ctl:focus-visible, .job-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stat .n {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat .l { font-size: 13px; color: var(--muted); }
.stat[data-f="new"] .n { color: var(--accent); }
.stat[data-f="entry"] .n { color: var(--ok); }
.stat[data-f="soon"] .n { color: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl {
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  min-height: 38px;
}
#q { flex: 1 1 220px; min-width: 0; }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.list {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.job {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  padding: 14px 18px;
  border-top: 1px solid var(--line);
}
.job:first-child { border-top: 0; }
.job-main { min-width: 0; display: grid; gap: 4px; }
.job-co { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.job-co .co { font-weight: 600; color: var(--ink); }
.job-co .id { font-family: var(--font-mono); font-size: 12px; }
.job-co .src {
  font-size: 11px;
  font-weight: 600;
  padding: 0 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--muted);
}
.job-title {
  color: var(--ink);
  font-weight: 600;
  font-size: 16px;
  text-decoration: none;
  overflow-wrap: anywhere;
}
.job-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.entry { background: var(--ok-soft); color: var(--ok); }
.tag.soon { background: var(--warn-soft); color: var(--warn); }
.job-side {
  text-align: right;
  display: grid;
  align-content: start;
  gap: 2px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dl { font-family: var(--font-mono); font-weight: 500; font-size: 14px; }
.dl.soon { color: var(--warn); }
.dl.open { color: var(--muted); }
.reg { font-size: 12px; color: var(--muted); }
.empty { padding: 32px 18px; text-align: center; color: var(--muted); }

.notes { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
.notes h2 { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); margin: 0; }
.notes p { margin: 0; max-width: 70ch; }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .job { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 14px; }
  .job-side { text-align: left; display: flex; gap: 10px; align-items: baseline; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>게임 QA 공고</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="stats" role="group" aria-label="공고 필터">
    <button class="stat" type="button" id="f-all" data-f="all" aria-pressed="true"><span class="n" data-n="all">0</span><span class="l">전체 QA 공고</span></button>
    <button class="stat" type="button" id="f-new" data-f="new" aria-pressed="false"><span class="n" data-n="new">0</span><span class="l">최근 7일 새 공고</span></button>
    <button class="stat" type="button" id="f-entry" data-f="entry" aria-pressed="false"><span class="n" data-n="entry">0</span><span class="l">신입 지원 가능</span></button>
    <button class="stat" type="button" id="f-soon" data-f="soon" aria-pressed="false"><span class="n" data-n="soon">0</span><span class="l">마감 7일 이내</span></button>
  </div>

  <div class="toolbar">
    <input class="ctl" id="q" type="search" placeholder="회사, 게임 이름으로 찾기" aria-label="검색">
    <select class="ctl" id="site" aria-label="사이트">
      <option value="">모든 사이트</option>
      <option value="게임잡">게임잡</option>
      <option value="알바몬">알바몬</option>
    </select>
    <select class="ctl" id="region" aria-label="지역">

      <option value="서울">서울</option>
      <option value="경기">경기</option>
      <option value="etc">그 외 지역</option>

      <option value="">모든 고용형태</option>

      <option value="계약직">계약직</option>
      <option value="파견직">파견직</option>
      <option value="아르바이트">아르바이트</option>
    </select>
    <select class="ctl" id="sort" aria-label="정렬">
      <option value="reg">등록일순</option>
      <option value="dl">마감일순</option>
    </select>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <ul class="list" id="list"></ul>

  <section class="notes">
    <h2>읽는 법</h2>
    <p id="note-dday"></p>
    <p><b>신입 지원 가능</b>은 게임잡에서는 경력 조건이 "신입" 또는 "경력무관"인 공고, 알바몬에서는 "초보 가능"이거나 제목에 신입·초보가 있는 공고입니다. 알바몬은 고용형태 대신 근무 기간과 급여를 보여 줍니다.</p>
    <p id="note-excluded"></p>
  </section>
</div>

const dayNum = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5;
const isIso = s => /^\d{4}-\d\d-\d\d$/.test(s);
const md = iso => iso.slice(5, 7) + "/" + iso.slice(8, 10);
const T = dayNum(META.today);

const JOBS = JOBS_RAW.map(j => {
  const regAgo = T - dayNum(j.reg);
  const dday = isIso(j.dl) ? dayNum(j.dl) - T : null;
  return Object.assign({}, j, {
    regAgo, dday,
    isNew: regAgo <= 7,
    isEntry: !!j.entry,
    isSoon: dday !== null && dday >= 0 && dday <= 7
  });
});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { f: "all" };

$("#eyebrow").textContent = META.sources.map(s => s.name).join(" · ") + " · " + META.today + " 수집";
$("#sub").innerHTML = META.sources.map(s =>
    '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a> " + s.kept + "건").join(", ") +
  ", 모두 " + JOBS.length + "건의 게임 QA 공고입니다. 두 사이트에 같은 제목으로 올라온 공고는 한 번만 넣었어요. 위쪽 숫자를 누르면 해당 공고만 볼 수 있어요.";
$("#note-dday").innerHTML = "<b>D-day</b>는 " + esc(META.todayLabel) +
  "을 기준으로 계산했습니다. \"채용시\", \"상시\" 공고는 날짜 없이 마감될 수 있으니 지원 전에 공고를 다시 확인하세요.";
$("#note-excluded").innerHTML = META.excluded.length
  ? "<b>목록에서 뺀 공고 " + META.excluded.length + "건:</b> QA 직종으로 올라왔지만 제목에 QA 업무가 보이지 않는 공고입니다. " +
    META.excluded.map(e => esc(e.src) + " " + esc(e.co) + "(" + esc(e.title) + ")").join(", ")
  : "";

const counts = {
  all: JOBS.length,
  new: JOBS.filter(j => j.isNew).length,
  entry: JOBS.filter(j => j.isEntry).length,
  soon: JOBS.filter(j => j.isSoon).length
};
document.querySelectorAll("[data-n]").forEach(el => { el.textContent = counts[el.dataset.n]; });

function regLabel(j) {
  if (j.regAgo <= 0) return "오늘 등록";
  if (j.regAgo <= 7) return j.regAgo + "일 전 등록";
  return md(j.reg) + " 등록";
}
function dlLabel(j) {
  if (j.dday === null) return '<span class="dl open">' + esc(j.dl) + "</span>";
  const d = j.dday === 0 ? "D-day" : j.dday > 0 ? "D-" + j.dday : "마감";
  return '<span class="dl' + (j.isSoon ? " soon" : "") + '">' + d + " · ~" + md(j.dl) + "</span>";
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const site = $("#site").value;
  const region = $("#region").value;
  const employ = $("#employ").value;
  const sort = $("#sort").value;

  const rows = JOBS.filter(j => {
    if (state.f === "new" && !j.isNew) return false;
    if (state.f === "entry" && !j.isEntry) return false;
    if (state.f === "soon" && !j.isSoon) return false;
    if (site && j.src !== site) return false;
    if (region === "etc" ? /서울|경기/.test(j.region) : region && !j.region.includes(region)) return false;
    if (employ && !j.employ.includes(employ)) return false;
    if (q && !(j.co + " " + j.title).toLowerCase().includes(q)) return false;
    return true;
  });

  rows.sort(sort === "dl"
    ? (a, b) => (a.dday ?? 9999) - (b.dday ?? 9999) || a.regAgo - b.regAgo
    : (a, b) => a.regAgo - b.regAgo || b.id - a.id);

  $("#count").textContent = rows.length + "건 표시 중";
  $("#list").innerHTML = rows.length ? rows.map(j => `
    <li class="job">
      <div class="job-main">
        <div class="job-co"><span class="src">${esc(j.src)}</span><span class="co">${esc(j.co)}</span><span class="id">#${j.id}</span></div>
        <a class="job-title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <div class="tags">
          ${j.isNew ? '<span class="tag new">새 공고</span>' : ""}
          ${j.isEntry ? '<span class="tag entry">신입 가능</span>' : ""}
          ${j.isSoon ? '<span class="tag soon">마감 임박</span>' : ""}
          <span>${[j.career, j.region, j.employ, j.platform, j.pay].filter(Boolean).map(esc).join(" · ")}${j.edu && j.edu !== "학력무관" ? " · " + esc(j.edu) : ""}</span>
        </div>
      </div>
      <div class="job-side">${dlLabel(j)}<span class="reg">${regLabel(j)}</span></div>
    </li>`).join("") : '<li class="empty">조건에 맞는 공고가 없어요. 필터를 바꾸거나 검색어를 지워 보세요.</li>';
}

function setFilter(f) {
  state.f = f;
  document.querySelectorAll(".stat").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
  render();
}

document.querySelectorAll(".stat").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.f)));
["#q", "#site", "#region", "#employ", "#sort"].forEach(s => $(s).addEventListener("input", render));

const h = location.hash.slice(1);
setFilter(["new", "entry", "soon"].includes(h) ? h : "all");
</script>
</body>
</html>
